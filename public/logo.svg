<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Section Designer logo.
    Replace this file (public/logo.svg) with the final project logo to rebrand
    the toolbar, favicon, About dialog and PDF report — no code changes needed.
  -->
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sdAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#sdBg)" stroke="#3b82f6" stroke-width="6"/>

  <!-- Coordinate axes -->
  <line x1="46" y1="210" x2="46" y2="60" stroke="#22c55e" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <line x1="46" y1="210" x2="196" y2="210" stroke="#ef4444" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- I-section cross-section -->
  <path d="M 84 66
           L 176 66
           L 176 96
           L 144 96
           L 144 160
           L 176 160
           L 176 190
           L 84 190
           L 84 160
           L 116 160
           L 116 96
           L 84 96
           Z"
        fill="url(#sdAccent)" stroke="#dbeafe" stroke-width="5" stroke-linejoin="round"/>

  <!-- Centroid marker -->
  <circle cx="130" cy="128" r="14" fill="none" stroke="#fbbf24" stroke-width="6"/>
  <line x1="130" y1="106" x2="130" y2="150" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="108" y1="128" x2="152" y2="128" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
</svg>
